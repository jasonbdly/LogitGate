[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logitgate"
version = "0.1.0"
description = "The 50ms zero-token LLM evaluation & decision engine. Mathematically debiased first-token logit gates and 3-layer cascaded routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jason Bradley", email = "jasonbdly@gmail.com" }
]
keywords = ["llm", "evaluation", "logprobs", "logits", "calibration", "cascaded-routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/jasonbdly/logitgate"
Repository = "https://github.com/jasonbdly/logitgate"
Mirror = "https://gitlab.com/jasonbdly/logitgate"

[project.scripts]
logitgate = "logitgate.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
deepeval = ["deepeval>=1.0.0"]
langgraph = ["langgraph>=0.0.1"]
pytest = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
all = [
    "openai>=1.0.0",
    "deepeval>=1.0.0",
    "langgraph>=0.0.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.entry-points.pytest11]
logitgate = "logitgate.integrations.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]
