[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logitgate"
version = "0.5.1"
description = "Fast, calibrated first-token logit evaluation and 3-layer cascaded routing for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jason Bradley", email = "jasonbdly@gmail.com" }
]
keywords = ["llm", "evaluation", "logprobs", "logits", "calibration", "cascaded-routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.23.0",
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jasonbdly/LogitGate"
Repository = "https://github.com/jasonbdly/LogitGate"
Mirror = "https://gitlab.com/jasonbdly/logitgate"

[project.scripts]
logitgate = "logitgate.cli:main"

[project.optional-dependencies]
openai = []
deepeval = ["deepeval>=1.0.0"]
langgraph = ["langgraph>=0.0.1"]
llamacpp = ["llama-cpp-python>=0.2.0"]
recurrent = ["torch>=2.0.0", "transformers>=4.40.0", "huggingface-hub>=0.20.0", "safetensors>=0.4.1"]
pytest = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
all = [
    "deepeval>=1.0.0",
    "langgraph>=0.0.1",
    "llama-cpp-python>=0.2.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Many tests rely on the implicit offline stub on purpose; the warning has dedicated tests.
filterwarnings = ["ignore::logitgate.exceptions.StubBackendWarning"]

[tool.mypy]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "deepeval.*",
    "langgraph.*",
    "llama_cpp.*",
    "torch.*",
    "transformers.*",
    "huggingface_hub.*",
    "safetensors.*",
]
ignore_missing_imports = true

[project.entry-points.pytest11]
logitgate = "logitgate.integrations.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logitgate = ["py.typed"]
