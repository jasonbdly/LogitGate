[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logitgate"
version = "0.15.0"
description = "Fast, calibrated first-token logit evaluation and 3-layer cascaded routing for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jason Bradley", email = "jasonbdly@gmail.com" }
]
keywords = ["llm", "evaluation", "logprobs", "logits", "calibration", "cascaded-routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.23.0",
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jasonbdly/LogitGate"
Repository = "https://github.com/jasonbdly/LogitGate"
Mirror = "https://gitlab.com/jasonbdly/logitgate"

[project.scripts]
logitgate = "logitgate.cli:main"

[project.optional-dependencies]
openai = []
deepeval = ["deepeval>=1.0.0"]
langgraph = ["langgraph>=0.0.1"]
llamacpp = ["llama-cpp-python>=0.2.0"]
recurrent = ["torch>=2.0.0", "transformers>=4.40.0", "huggingface-hub>=0.20.0", "safetensors>=0.4.1"]
distill = ["torch>=2.0.0", "transformers>=4.40.0", "peft>=0.10.0", "safetensors>=0.4.1"]
otel = ["opentelemetry-api>=1.20.0"]
pytest = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "hypothesis>=6.100.0"]
all = [
    "deepeval>=1.0.0",
    "langgraph>=0.0.1",
    "llama-cpp-python>=0.2.0",
    "opentelemetry-api>=1.20.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Many tests rely on the implicit offline stub on purpose; the warning has dedicated tests.
filterwarnings = ["ignore::logitgate.exceptions.StubBackendWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM", "UP", "PT", "RUF", "PERF", "S", "I", "A"]
ignore = [
    # LLM token identifiers (pass_token="A", target_tokens=("A", "B")) trigger Bandit's naive password name regex
    "S105",
    "S106",
    "S107",
    # Non-cryptographic PRNG is intentional for retry backoff jitter / bootstrap resampling (secrets is used for nonces)
    "S311",
    # Per-item try/except inside batch evaluation loops has zero overhead on the non-throwing path in Python 3.11+
    # while remaining required on Python 3.10
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest uses assert statements
    "S108",    # mock /tmp paths in unit tests
    "S608",    # parameterized test SQL inspection strings
    "E402",    # sys.meta_path / reload setup before imports in specialized tests
    "PT011",   # broad ValueError/ConfigurationError raises checks in legacy tests
    "PT012",   # multi-statement setup inside pytest.raises blocks
    "PT018",   # composite boolean assertions in unit tests
    "RUF043",  # literal match strings in pytest.raises
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "deepeval.*",
    "langgraph.*",
    "llama_cpp.*",
    "peft.*",
    "torch.*",
    "transformers.*",
    "huggingface_hub.*",
    "opentelemetry.*",
    "safetensors.*",
]
ignore_missing_imports = true

[project.entry-points.pytest11]
logitgate = "logitgate.integrations.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logitgate = ["py.typed"]
