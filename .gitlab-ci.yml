stages:
  - test
  - lint
  - release

variables:
  GITHUB_REPO: "jasonbdly/LogitGate"

default:
  image: python:3.11-slim
  before_script:
    - python -V
    - python -m pip install --upgrade pip

.github_commit_status:
  image: python:3.11-slim
  before_script: []
  allow_failure: true
  script:
    - |
      python - <<'EOF'
      import json
      import os
      import time
      import urllib.error
      import urllib.request

      token = os.environ.get("GITHUB_TOKEN", "").strip()
      repo = os.environ.get("GITHUB_REPO", "").strip()
      sha = os.environ.get("CI_COMMIT_SHA", "").strip()
      state = os.environ["GH_STATUS_STATE"]
      desc = os.environ["GH_STATUS_DESC"][:140]
      target_url = os.environ.get("CI_PIPELINE_URL", "")
      if not (token and repo and sha):
          raise SystemExit(0)

      url = f"https://api.github.com/repos/{repo}/statuses/{sha}"
      payload = json.dumps({
          "state": state,
          "target_url": target_url,
          "description": desc,
          "context": "gitlab-ci",
      }).encode("utf-8")
      headers = {
          "Accept": "application/vnd.github+json",
          "Authorization": f"Bearer {token}",
          "Content-Type": "application/json",
          "X-GitHub-Api-Version": "2022-11-28",
          "User-Agent": "logitgate-gitlab-ci",
      }
      for attempt in range(6):
          req = urllib.request.Request(url, data=payload, headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"Synced GitHub commit status '{state}' for {sha[:8]} (HTTP {resp.status})")
              break
          except urllib.error.HTTPError as exc:
              if exc.code in (404, 422) and attempt < 5:
                  print(f"Waiting for GitLab push mirror to land {sha[:8]} on GitHub (HTTP {exc.code})...")
                  time.sleep(3 * (attempt + 1))
                  continue
              print(f"GitHub commit status sync returned HTTP {exc.code}: {exc.read().decode('utf-8', 'replace')}")
              break
      EOF

github_status_pending:
  extends: .github_commit_status
  stage: test
  variables:
    GH_STATUS_STATE: "pending"
    GH_STATUS_DESC: "GitLab CI pipeline #$CI_PIPELINE_ID running"
  rules:
    - if: $GITHUB_TOKEN

github_status_success:
  extends: .github_commit_status
  stage: .post
  variables:
    GH_STATUS_STATE: "success"
    GH_STATUS_DESC: "GitLab CI pipeline #$CI_PIPELINE_ID passed"
  rules:
    - if: $GITHUB_TOKEN
      when: on_success

github_status_failure:
  extends: .github_commit_status
  stage: .post
  variables:
    GH_STATUS_STATE: "failure"
    GH_STATUS_DESC: "GitLab CI pipeline #$CI_PIPELINE_ID failed"
  rules:
    - if: $GITHUB_TOKEN
      when: on_failure

pytest:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10-slim", "3.11-slim", "3.12-slim", "3.13-slim"]
  image: python:$PYTHON_VERSION
  script:
    - pip install -e ".[test]"
    - pytest tests -v

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install -e ".[test]"
    - pip install ruff mypy
    - ruff check src/logitgate tests
    - mypy src/logitgate tests

release:
  stage: release
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    - twine upload --skip-existing dist/*
    - |
      python - <<'EOF'
      import json
      import os
      import re
      import urllib.error
      import urllib.request
      from pathlib import Path

      tag = os.environ["CI_COMMIT_TAG"]
      version = tag.lstrip("v")
      api_v4 = os.environ["CI_API_V4_URL"]
      project_id = os.environ["CI_PROJECT_ID"]
      job_token = os.environ["CI_JOB_TOKEN"]

      changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
      pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
      match = re.search(pattern, changelog, flags=re.DOTALL)
      notes = match.group(1).strip() if match else f"Release {tag}"

      # 1. Upload built wheel & sdist to GitLab Generic Package Registry
      asset_links = []
      for dist_file in sorted(Path("dist").iterdir()):
          if not dist_file.is_file():
              continue
          pkg_url = f"{api_v4}/projects/{project_id}/packages/generic/logitgate/{version}/{dist_file.name}"
          upload_req = urllib.request.Request(
              pkg_url,
              data=dist_file.read_bytes(),
              headers={
                  "Content-Type": "application/octet-stream",
                  "JOB-TOKEN": job_token,
              },
              method="PUT",
          )
          with urllib.request.urlopen(upload_req) as resp:
              print(f"Uploaded {dist_file.name} to GitLab Package Registry (HTTP {resp.status})")
          asset_links.append({
              "name": dist_file.name,
              "url": pkg_url,
              "direct_asset_path": f"/{dist_file.name}",
              "link_type": "package",
          })

      # 2. Create or update the GitLab Release with package assets attached
      releases_url = f"{api_v4}/projects/{project_id}/releases"
      payload = json.dumps({
          "name": f"LogitGate {tag}",
          "tag_name": tag,
          "description": notes,
          "assets": {"links": asset_links},
      }).encode("utf-8")
      req = urllib.request.Request(
          releases_url,
          data=payload,
          headers={
              "Content-Type": "application/json",
              "JOB-TOKEN": job_token,
          },
          method="POST",
      )
      try:
          with urllib.request.urlopen(req) as resp:
              print(f"Created GitLab release for {tag} with {len(asset_links)} package assets (HTTP {resp.status})")
      except urllib.error.HTTPError as exc:
          if exc.code == 409:
              # Release already exists: delete and recreate so commit SHA and released_at update cleanly
              delete_url = f"{releases_url}/{tag}"
              del_req = urllib.request.Request(
                  delete_url,
                  headers={"JOB-TOKEN": job_token},
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(del_req):
                      print(f"Deleted stale GitLab release {tag} to recreate cleanly")
                  with urllib.request.urlopen(req) as resp:
                      print(f"Recreated GitLab release for {tag} (HTTP {resp.status})")
              except urllib.error.HTTPError:
                  # Fallback if CI_JOB_TOKEN lacks DELETE permission: update description, released_at, and links
                  from datetime import datetime, timezone
                  now_iso = datetime.now(timezone.utc).isoformat()
                  update_req = urllib.request.Request(
                      delete_url,
                      data=json.dumps({
                          "name": f"LogitGate {tag}",
                          "description": notes,
                          "released_at": now_iso,
                      }).encode("utf-8"),
                      headers={"Content-Type": "application/json", "JOB-TOKEN": job_token},
                      method="PUT",
                  )
                  with urllib.request.urlopen(update_req):
                      print(f"Updated GitLab release notes and released_at for {tag}")
                  links_url = f"{delete_url}/assets/links"
                  for link in asset_links:
                      try:
                          link_req = urllib.request.Request(
                              links_url,
                              data=json.dumps(link).encode("utf-8"),
                              headers={"Content-Type": "application/json", "JOB-TOKEN": job_token},
                              method="POST",
                          )
                          with urllib.request.urlopen(link_req):
                              print(f"Attached asset link {link['name']} to existing release {tag}")
                      except urllib.error.HTTPError as link_exc:
                          if link_exc.code != 409:
                              print(f"Asset link {link['name']} status: {link_exc.code}")
          else:
              raise

      # 3. Mirror release, changelog notes, and dist/* assets to GitHub Releases
      gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
      gh_repo = os.environ.get("GITHUB_REPO", "").strip()
      if gh_token and gh_repo:
          import time
          import urllib.parse

          project_url = os.environ.get("CI_PROJECT_URL", "https://gitlab.com/jasonbdly/logitgate")
          pipeline_url = os.environ.get("CI_PIPELINE_URL", f"{project_url}/-/pipelines")
          pipeline_id = os.environ.get("CI_PIPELINE_ID", "")
          gh_notes = (
              f"{notes}\n\n---\n"
              f"*Canonical release and CI pipeline on GitLab: "
              f"[{tag}]({project_url}/-/releases/{tag}) "
              f"([pipeline #{pipeline_id}]({pipeline_url}))*"
          )
          gh_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {gh_token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "logitgate-gitlab-ci",
          }
          gh_rel_base = f"https://api.github.com/repos/{gh_repo}/releases"
          gh_release = None

          # Check if a GitHub release for this tag already exists
          check_req = urllib.request.Request(
              f"{gh_rel_base}/tags/{urllib.parse.quote(tag)}",
              headers=gh_headers,
              method="GET",
          )
          try:
              with urllib.request.urlopen(check_req, timeout=15) as resp:
                  existing = json.loads(resp.read().decode("utf-8"))
              patch_req = urllib.request.Request(
                  f"{gh_rel_base}/{existing['id']}",
                  data=json.dumps({
                      "name": f"LogitGate {tag}",
                      "body": gh_notes,
                      "draft": False,
                      "prerelease": "-" in version,
                  }).encode("utf-8"),
                  headers={**gh_headers, "Content-Type": "application/json"},
                  method="PATCH",
              )
              with urllib.request.urlopen(patch_req, timeout=15) as resp:
                  gh_release = json.loads(resp.read().decode("utf-8"))
              for asset in existing.get("assets", []):
                  del_asset_req = urllib.request.Request(
                      f"{gh_rel_base}/assets/{asset['id']}",
                      headers=gh_headers,
                      method="DELETE",
                  )
                  with urllib.request.urlopen(del_asset_req, timeout=15):
                      pass
              print(f"Updated existing GitHub release for {tag}")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  create_payload = json.dumps({
                      "tag_name": tag,
                      "name": f"LogitGate {tag}",
                      "body": gh_notes,
                      "draft": False,
                      "prerelease": "-" in version,
                  }).encode("utf-8")
                  for attempt in range(6):
                      create_req = urllib.request.Request(
                          gh_rel_base,
                          data=create_payload,
                          headers={**gh_headers, "Content-Type": "application/json"},
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(create_req, timeout=15) as resp:
                              gh_release = json.loads(resp.read().decode("utf-8"))
                          print(f"Created GitHub release for {tag}")
                          break
                      except urllib.error.HTTPError as c_exc:
                          if c_exc.code == 422 and attempt < 5:
                              print(f"Waiting for GitLab push mirror to sync tag {tag} to GitHub...")
                              time.sleep(3 * (attempt + 1))
                              continue
                          print(f"GitHub release creation returned HTTP {c_exc.code}: {c_exc.read().decode('utf-8', 'replace')}")
                          break
              else:
                  print(f"GitHub release lookup returned HTTP {exc.code}: {exc.read().decode('utf-8', 'replace')}")

          if gh_release and gh_release.get("id"):
              rel_id = gh_release["id"]
              for dist_file in sorted(Path("dist").iterdir()):
                  if not dist_file.is_file():
                      continue
                  asset_url = (
                      f"https://uploads.github.com/repos/{gh_repo}/releases/{rel_id}/assets"
                      f"?name={urllib.parse.quote(dist_file.name)}"
                  )
                  asset_req = urllib.request.Request(
                      asset_url,
                      data=dist_file.read_bytes(),
                      headers={**gh_headers, "Content-Type": "application/octet-stream"},
                      method="POST",
                  )
                  with urllib.request.urlopen(asset_req, timeout=30) as resp:
                      print(f"Uploaded {dist_file.name} to GitHub Release {tag} (HTTP {resp.status})")
      EOF
  artifacts:
    name: "logitgate-$CI_COMMIT_TAG"
    paths:
      - dist/*

pypi_readme_sync:
  stage: release
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /^(feat|chore)\(release\):/
      changes:
        - README.md
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install build twine
    - |
      python - <<'EOF'
      import json
      import re
      import urllib.error
      import urllib.request
      from pathlib import Path

      pyproject_path = Path("pyproject.toml")
      text = pyproject_path.read_text(encoding="utf-8")
      m = re.search(r'^version\s*=\s*["\']([^"\']+)["\']', text, flags=re.MULTILINE)
      if not m:
          raise SystemExit("Could not find version in pyproject.toml")
      base_version = m.group(1)

      try:
          with urllib.request.urlopen("https://pypi.org/pypi/logitgate/json", timeout=15) as resp:
              pypi_data = json.load(resp)
          published = set(pypi_data.get("releases", {}).keys())
      except urllib.error.URLError as exc:
          raise SystemExit(f"Failed to query PyPI releases: {exc}")

      if base_version not in published:
          print(
              f"Base version {base_version} is not yet published on PyPI; "
              "skipping post-release README sync (will publish via tag release)."
          )
          raise SystemExit(0)

      post_nums = [0]
      post_re = re.compile(rf"^{re.escape(base_version)}\.post(\d+)$")
      for ver in published:
          pm = post_re.match(ver)
          if pm:
              post_nums.append(int(pm.group(1)))
      next_version = f"{base_version}.post{max(post_nums) + 1}"

      updated = re.sub(
          r'^version\s*=\s*["\'][^"\']+["\']',
          f'version = "{next_version}"',
          text,
          count=1,
          flags=re.MULTILINE,
      )
      pyproject_path.write_text(updated, encoding="utf-8")
      init_path = Path("src/logitgate/__init__.py")
      init_text = init_path.read_text(encoding="utf-8")
      init_updated = re.sub(
          r'^__version__\s*=\s*["\'][^"\']+["\']',
          f'__version__ = "{next_version}"',
          init_text,
          count=1,
          flags=re.MULTILINE,
      )
      init_path.write_text(init_updated, encoding="utf-8")
      Path(".pypi_sync_version").write_text(next_version, encoding="utf-8")
      print(f"Prepared PEP 440 post-release {next_version} to sync README.md to PyPI")
      EOF
    - |
      if [ -f .pypi_sync_version ]; then
        python -m build
        twine check dist/*
        twine upload --skip-existing dist/*
      fi
