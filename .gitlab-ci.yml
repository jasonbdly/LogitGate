stages:
  - test
  - lint
  - release

default:
  image: python:3.11-slim
  before_script:
    - python -V
    - python -m pip install --upgrade pip

pytest:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10-slim", "3.11-slim", "3.12-slim", "3.13-slim"]
  image: python:$PYTHON_VERSION
  script:
    - pip install -e ".[test]"
    - pytest tests -v

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install -e ".[test]"
    - pip install ruff mypy
    - ruff check src/logitgate tests
    - mypy src/logitgate tests

release:
  stage: release
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    - twine upload --skip-existing dist/*
    - |
      python - <<'EOF'
      import json
      import os
      import re
      import urllib.error
      import urllib.request
      from pathlib import Path

      tag = os.environ["CI_COMMIT_TAG"]
      version = tag.lstrip("v")
      api_v4 = os.environ["CI_API_V4_URL"]
      project_id = os.environ["CI_PROJECT_ID"]
      job_token = os.environ["CI_JOB_TOKEN"]

      changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
      pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
      match = re.search(pattern, changelog, flags=re.DOTALL)
      notes = match.group(1).strip() if match else f"Release {tag}"

      # 1. Upload built wheel & sdist to GitLab Generic Package Registry
      asset_links = []
      for dist_file in sorted(Path("dist").iterdir()):
          if not dist_file.is_file():
              continue
          pkg_url = f"{api_v4}/projects/{project_id}/packages/generic/logitgate/{version}/{dist_file.name}"
          upload_req = urllib.request.Request(
              pkg_url,
              data=dist_file.read_bytes(),
              headers={
                  "Content-Type": "application/octet-stream",
                  "JOB-TOKEN": job_token,
              },
              method="PUT",
          )
          with urllib.request.urlopen(upload_req) as resp:
              print(f"Uploaded {dist_file.name} to GitLab Package Registry (HTTP {resp.status})")
          asset_links.append({
              "name": dist_file.name,
              "url": pkg_url,
              "direct_asset_path": f"/{dist_file.name}",
              "link_type": "package",
          })

      # 2. Create or update the GitLab Release with package assets attached
      releases_url = f"{api_v4}/projects/{project_id}/releases"
      payload = json.dumps({
          "name": f"LogitGate {tag}",
          "tag_name": tag,
          "description": notes,
          "assets": {"links": asset_links},
      }).encode("utf-8")
      req = urllib.request.Request(
          releases_url,
          data=payload,
          headers={
              "Content-Type": "application/json",
              "JOB-TOKEN": job_token,
          },
          method="POST",
      )
      try:
          with urllib.request.urlopen(req) as resp:
              print(f"Created GitLab release for {tag} with {len(asset_links)} package assets (HTTP {resp.status})")
      except urllib.error.HTTPError as exc:
          if exc.code == 409:
              # Release already exists: delete and recreate so commit SHA and released_at update cleanly
              delete_url = f"{releases_url}/{tag}"
              del_req = urllib.request.Request(
                  delete_url,
                  headers={"JOB-TOKEN": job_token},
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(del_req):
                      print(f"Deleted stale GitLab release {tag} to recreate cleanly")
                  with urllib.request.urlopen(req) as resp:
                      print(f"Recreated GitLab release for {tag} (HTTP {resp.status})")
              except urllib.error.HTTPError:
                  # Fallback if CI_JOB_TOKEN lacks DELETE permission: update description, released_at, and links
                  from datetime import datetime, timezone
                  now_iso = datetime.now(timezone.utc).isoformat()
                  update_req = urllib.request.Request(
                      delete_url,
                      data=json.dumps({
                          "name": f"LogitGate {tag}",
                          "description": notes,
                          "released_at": now_iso,
                      }).encode("utf-8"),
                      headers={"Content-Type": "application/json", "JOB-TOKEN": job_token},
                      method="PUT",
                  )
                  with urllib.request.urlopen(update_req):
                      print(f"Updated GitLab release notes and released_at for {tag}")
                  links_url = f"{delete_url}/assets/links"
                  for link in asset_links:
                      try:
                          link_req = urllib.request.Request(
                              links_url,
                              data=json.dumps(link).encode("utf-8"),
                              headers={"Content-Type": "application/json", "JOB-TOKEN": job_token},
                              method="POST",
                          )
                          with urllib.request.urlopen(link_req):
                              print(f"Attached asset link {link['name']} to existing release {tag}")
                      except urllib.error.HTTPError as link_exc:
                          if link_exc.code != 409:
                              print(f"Asset link {link['name']} status: {link_exc.code}")
          else:
              raise
      EOF
  artifacts:
    name: "logitgate-$CI_COMMIT_TAG"
    paths:
      - dist/*

pypi_readme_sync:
  stage: release
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /^(feat|chore)\(release\):/
      changes:
        - README.md
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install build twine
    - |
      python - <<'EOF'
      import json
      import re
      import urllib.error
      import urllib.request
      from pathlib import Path

      pyproject_path = Path("pyproject.toml")
      text = pyproject_path.read_text(encoding="utf-8")
      m = re.search(r'^version\s*=\s*["\']([^"\']+)["\']', text, flags=re.MULTILINE)
      if not m:
          raise SystemExit("Could not find version in pyproject.toml")
      base_version = m.group(1)

      try:
          with urllib.request.urlopen("https://pypi.org/pypi/logitgate/json", timeout=15) as resp:
              pypi_data = json.load(resp)
          published = set(pypi_data.get("releases", {}).keys())
      except urllib.error.URLError as exc:
          raise SystemExit(f"Failed to query PyPI releases: {exc}")

      if base_version not in published:
          print(
              f"Base version {base_version} is not yet published on PyPI; "
              "skipping post-release README sync (will publish via tag release)."
          )
          raise SystemExit(0)

      post_nums = [0]
      post_re = re.compile(rf"^{re.escape(base_version)}\.post(\d+)$")
      for ver in published:
          pm = post_re.match(ver)
          if pm:
              post_nums.append(int(pm.group(1)))
      next_version = f"{base_version}.post{max(post_nums) + 1}"

      updated = re.sub(
          r'^version\s*=\s*["\'][^"\']+["\']',
          f'version = "{next_version}"',
          text,
          count=1,
          flags=re.MULTILINE,
      )
      pyproject_path.write_text(updated, encoding="utf-8")
      init_path = Path("src/logitgate/__init__.py")
      init_text = init_path.read_text(encoding="utf-8")
      init_updated = re.sub(
          r'^__version__\s*=\s*["\'][^"\']+["\']',
          f'__version__ = "{next_version}"',
          init_text,
          count=1,
          flags=re.MULTILINE,
      )
      init_path.write_text(init_updated, encoding="utf-8")
      Path(".pypi_sync_version").write_text(next_version, encoding="utf-8")
      print(f"Prepared PEP 440 post-release {next_version} to sync README.md to PyPI")
      EOF
    - |
      if [ -f .pypi_sync_version ]; then
        python -m build
        twine check dist/*
        twine upload --skip-existing dist/*
      fi
