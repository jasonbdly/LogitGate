stages:
  - test
  - lint

default:
  image: python:3.11-slim
  before_script:
    - python -V
    - python -m pip install --upgrade pip

pytest:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10-slim", "3.11-slim", "3.12-slim"]
  image: python:$PYTHON_VERSION
  script:
    - pip install -e ".[test]"
    - pytest tests -v

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install -e ".[test]"
    - pip install ruff mypy
    - ruff check src/logitgate tests
    - mypy src/logitgate
