stages:
  - test
  - lint
  - release

variables:
  GITHUB_REPO: "jasonbdly/LogitGate"

default:
  image: python:3.11-slim
  before_script:
    - python -V
    - python -m pip install --upgrade pip

.github_commit_status:
  image: alpine:3.20
  before_script:
    - apk add --no-cache github-cli
  allow_failure: true
  script:
    - |
      for i in 1 2 3 4 5; do
        gh api "repos/$GITHUB_REPO/statuses/$CI_COMMIT_SHA" \
          -f state="$GH_STATUS_STATE" \
          -f target_url="$CI_PIPELINE_URL" \
          -f description="$GH_STATUS_DESC" \
          -f context="gitlab-ci" && break
        sleep $((i * 3))
      done

github_status_pending:
  extends: .github_commit_status
  stage: test
  variables:
    GH_STATUS_STATE: "pending"
    GH_STATUS_DESC: "GitLab CI pipeline #$CI_PIPELINE_ID running"
  rules:
    - if: $GITHUB_TOKEN

github_status_success:
  extends: .github_commit_status
  stage: .post
  variables:
    GH_STATUS_STATE: "success"
    GH_STATUS_DESC: "GitLab CI pipeline #$CI_PIPELINE_ID passed"
  rules:
    - if: $GITHUB_TOKEN
      when: on_success

github_status_failure:
  extends: .github_commit_status
  stage: .post
  variables:
    GH_STATUS_STATE: "failure"
    GH_STATUS_DESC: "GitLab CI pipeline #$CI_PIPELINE_ID failed"
  rules:
    - if: $GITHUB_TOKEN
      when: on_failure

pytest:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10-slim", "3.11-slim", "3.12-slim", "3.13-slim"]
  image: python:$PYTHON_VERSION
  script:
    - pip install -e ".[test]"
    - pytest tests -v

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install -e ".[test]"
    - pip install ruff mypy
    - ruff check src/logitgate tests
    - mypy src/logitgate tests

release:
  stage: release
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    - twine upload --skip-existing dist/*
    - |
      python - <<'EOF'
      import os
      import re
      from pathlib import Path

      tag = os.environ["CI_COMMIT_TAG"]
      version = tag.lstrip("v")
      changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
      pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
      match = re.search(pattern, changelog, flags=re.DOTALL)
      notes = match.group(1).strip() if match else f"Release {tag}"
      notes = re.sub(r"\n+---\s*\Z", "", notes).strip()
      Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
      EOF
  artifacts:
    name: "logitgate-$CI_COMMIT_TAG"
    paths:
      - dist/*
      - release_notes.md

gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script: []
  needs:
    - job: release
      artifacts: true
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - glab release create "$CI_COMMIT_TAG" dist/*
        --name "LogitGate $CI_COMMIT_TAG"
        --notes-file release_notes.md
        --use-package-registry
        --package-name logitgate

github_release:
  stage: release
  image: alpine:3.20
  before_script:
    - apk add --no-cache github-cli
  needs:
    - job: release
      artifacts: true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $GITHUB_TOKEN
  script:
    - |
      printf '\n---\n*Canonical release and CI pipeline on GitLab: [%s](%s/-/releases/%s) ([pipeline #%s](%s))*\n' \
        "$CI_COMMIT_TAG" "$CI_PROJECT_URL" "$CI_COMMIT_TAG" "$CI_PIPELINE_ID" "$CI_PIPELINE_URL" >> release_notes.md
      gh release delete "$CI_COMMIT_TAG" -R "$GITHUB_REPO" --yes 2>/dev/null || true
      for i in 1 2 3 4 5; do
        gh release create "$CI_COMMIT_TAG" dist/* \
          -R "$GITHUB_REPO" \
          --title "LogitGate $CI_COMMIT_TAG" \
          --notes-file release_notes.md && break
        sleep $((i * 3))
      done

pypi_readme_sync:
  stage: release
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /^(feat|chore)\(release\):/
      changes:
        - README.md
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install build twine
    - |
      python - <<'EOF'
      import json
      import re
      import urllib.error
      import urllib.request
      from pathlib import Path

      pyproject_path = Path("pyproject.toml")
      text = pyproject_path.read_text(encoding="utf-8")
      m = re.search(r'^version\s*=\s*["\']([^"\']+)["\']', text, flags=re.MULTILINE)
      if not m:
          raise SystemExit("Could not find version in pyproject.toml")
      base_version = m.group(1)

      try:
          with urllib.request.urlopen("https://pypi.org/pypi/logitgate/json", timeout=15) as resp:
              pypi_data = json.load(resp)
          published = set(pypi_data.get("releases", {}).keys())
      except urllib.error.URLError as exc:
          raise SystemExit(f"Failed to query PyPI releases: {exc}")

      if base_version not in published:
          print(
              f"Base version {base_version} is not yet published on PyPI; "
              "skipping post-release README sync (will publish via tag release)."
          )
          raise SystemExit(0)

      post_nums = [0]
      post_re = re.compile(rf"^{re.escape(base_version)}\.post(\d+)$")
      for ver in published:
          pm = post_re.match(ver)
          if pm:
              post_nums.append(int(pm.group(1)))
      next_version = f"{base_version}.post{max(post_nums) + 1}"

      updated = re.sub(
          r'^version\s*=\s*["\'][^"\']+["\']',
          f'version = "{next_version}"',
          text,
          count=1,
          flags=re.MULTILINE,
      )
      pyproject_path.write_text(updated, encoding="utf-8")
      init_path = Path("src/logitgate/__init__.py")
      init_text = init_path.read_text(encoding="utf-8")
      init_updated = re.sub(
          r'^__version__\s*=\s*["\'][^"\']+["\']',
          f'__version__ = "{next_version}"',
          init_text,
          count=1,
          flags=re.MULTILINE,
      )
      init_path.write_text(init_updated, encoding="utf-8")
      Path(".pypi_sync_version").write_text(next_version, encoding="utf-8")
      print(f"Prepared PEP 440 post-release {next_version} to sync README.md to PyPI")
      EOF
    - |
      if [ -f .pypi_sync_version ]; then
        python -m build
        twine check dist/*
        twine upload --skip-existing dist/*
      fi

github_backfill:
  stage: .post
  image: alpine:3.20
  before_script:
    - apk add --no-cache github-cli python3
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITHUB_TOKEN
      changes:
        - .gitlab-ci.yml
      when: on_success
  script:
    - |
      python3 - <<'EOF'
      import json
      import os
      import re
      import subprocess
      import urllib.request
      from pathlib import Path

      gh_repo = os.environ["GITHUB_REPO"]
      project_url = os.environ.get("CI_PROJECT_URL", "https://gitlab.com/jasonbdly/logitgate")
      api_v4 = os.environ.get("CI_API_V4_URL", "https://gitlab.com/api/v4")
      project_id = os.environ.get("CI_PROJECT_ID", "jasonbdly%2Flogitgate")

      # 1. Fetch all finished GitLab pipelines
      pipelines = []
      for page in range(1, 6):
          url = f"{api_v4}/projects/{project_id}/pipelines?per_page=100&page={page}"
          with urllib.request.urlopen(url, timeout=15) as resp:
              batch = json.loads(resp.read().decode("utf-8"))
          if not batch:
              break
          pipelines.extend(batch)

      tag_to_pipe = {}
      sha_to_pipe = {}
      for p in pipelines:
          if p["status"] not in ("success", "failed"):
              continue
          ref, sha = p["ref"], p["sha"]
          if ref.startswith("v") and p["status"] == "success" and ref not in tag_to_pipe:
              tag_to_pipe[ref] = p
          if sha not in sha_to_pipe or (p["status"] == "success" and sha_to_pipe[sha]["status"] != "success"):
              sha_to_pipe[sha] = p

      # 2. Backfill canonical GitLab footer onto any GitHub Release missing it
      rels_raw = subprocess.check_output(["gh", "api", f"repos/{gh_repo}/releases?per_page=100"], text=True)
      for rel in json.loads(rels_raw):
          tag = rel["tag_name"]
          body = rel.get("body") or ""
          if f"{project_url}/-/releases/" in body:
              continue
          clean_body = re.sub(r"\n+---\s*\Z", "", body).strip()
          pipe = tag_to_pipe.get(tag)
          pipe_part = f" ([pipeline #{pipe['id']}]({pipe['web_url']}))" if pipe else ""
          footer = f"\n\n---\n*Canonical release and CI pipeline on GitLab: [{tag}]({project_url}/-/releases/{tag}){pipe_part}*\n"
          Path("backfill_notes.md").write_text(clean_body + footer, encoding="utf-8")
          subprocess.run(["gh", "release", "edit", tag, "-R", gh_repo, "--notes-file", "backfill_notes.md"], check=True)
          print(f"Backfilled GitLab footer onto GitHub Release {tag}")

      # 3. Backfill gitlab-ci commit status onto historical GitHub commits missing it
      commits_raw = subprocess.check_output(["gh", "api", f"repos/{gh_repo}/commits?per_page=100"], text=True)
      for c in json.loads(commits_raw):
          sha = c["sha"]
          if sha == os.environ.get("CI_COMMIT_SHA"):
              continue
          pipe = sha_to_pipe.get(sha)
          if not pipe:
              continue
          existing_raw = subprocess.check_output(["gh", "api", f"repos/{gh_repo}/commits/{sha}/statuses"], text=True)
          if any(s.get("context") == "gitlab-ci" for s in json.loads(existing_raw)):
              continue
          gh_state = "success" if pipe["status"] == "success" else "failure"
          word = "passed" if gh_state == "success" else "failed"
          subprocess.run([
              "gh", "api", f"repos/{gh_repo}/statuses/{sha}",
              "-f", f"state={gh_state}",
              "-f", f"target_url={pipe['web_url']}",
              "-f", f"description=GitLab CI pipeline #{pipe['id']} {word}",
              "-f", "context=gitlab-ci",
          ], check=True, stdout=subprocess.DEVNULL)
          print(f"Backfilled gitlab-ci ({gh_state}) onto {sha[:7]} -> #{pipe['id']}")
      EOF
